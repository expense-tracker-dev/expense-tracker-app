name: expense_tracker
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.1
  http: ^1.4.0
  flutter_secure_storage: ^11.2.0
  flutter_dotenv: ^6.0.1
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  image_path: "assets/dailydhan_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/dailydhan_icon.png